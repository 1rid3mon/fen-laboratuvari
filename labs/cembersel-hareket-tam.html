<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYT Çembersel Hareket — 9 Deney</title><style>
:root{font-family:system-ui;color-scheme:dark;background:#091321;color:#e8f4ff}*{box-sizing:border-box}body{max-width:1250px;margin:auto;padding:18px}h1{font-size:clamp(24px,4vw,38px)}p{line-height:1.55;color:#bbcbdf}button,select{font:inherit;color:#f3fbff;background:#1b344f;border:1px solid #54728e;border-radius:10px;padding:10px;cursor:pointer}button[aria-pressed=true]{background:#166a71;border-color:#64e1d4}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:16px}@media(max-width:780px){.layout{grid-template-columns:1fr}}section{background:#14243a;border:1px solid #304660;border-radius:17px;padding:18px}canvas{display:block;width:100%;background:#091827;border-radius:12px}label{display:block;margin:14px 0}input{width:100%;accent-color:#5ee1d2}output{color:#73ebd5;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metrics div{background:#0b1a2d;border-radius:9px;padding:10px}small{color:#aabed1}.note{border-left:3px solid #f4cb79;padding-left:12px}#equations{font-size:18px;color:#83ead9}a{color:#80e8d9}.controls{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}</style></head><body>
<a href="../index.html">← Ana sayfa</a><h1>AYT Fizik · Çembersel Hareket</h1><p><strong>Önce izle → sonra tek bir kaydırıcıyı değiştir → neyin değiştiğini söyle.</strong> Renkler: <span style='color:#f4c779'>sarı hız</span>, <span style='color:#f57d9d'>pembe içe doğru kuvvet</span>. Önce 1, 4 ve 6. deneyleri dene; sonra diğerlerine geç. Hesaplar ideal modeller içindir.</p><nav id="tabs" class="tabs" aria-label="Deneyler"></nav><div class="layout"><section><h2 id="heading"></h2><canvas id="canvas" width="760" height="530" aria-label="Etkileşimli fizik simülasyonu"></canvas><div class="controls"><button id="toggle">⏸ Durdur</button><button id="reset">↺ Sıfırla</button><button id="cut" hidden>✂ İpi kes</button><button id="unit">m/s → km/sa</button></div><p id="status" aria-live="polite"></p></section><section><h2>Değişkenler</h2><div id="inputs"></div><div id="metrics" class="metrics"></div></section></div><section><h2>Fizik ve YKS notları</h2><p id="equations"></p><p id="explain"></p><p class="note" id="caution"></p></section>
<script>
'use strict';const $=x=>document.getElementById(x),ctx=$('canvas').getContext('2d'),W=760,H=530,g=9.8,G=6.67430e-11,RE=6.371e6,ME=5.972e24;
const defs=[
{id:'uniform',name:'Düzgün çembersel',controls:[['r','Yarıçap (m)',1,5,.25,2],['m','Kütle (kg)',.5,5,.5,2],['v','Çizgisel hız (m/s)',.5,8,.5,4]],eq:'ω = v/r · aₘ = v²/r = ω²r · Fₘ = mv²/r · T = 2πr/v · f = 1/T',info:'Düzgün çembersel harekette hızın büyüklüğü sabittir ancak yönü sürekli değişir. Bu yüzden merkezcil ivme vardır. Bir tam turda yer değiştirme sıfır, alınan yol 2πr olur.',caution:'Merkezcil kuvvet yeni bir kuvvet değildir: içe doğru net kuvvetin adıdır.'},
{id:'force',name:'Merkezcil kuvvet/ivme',controls:[['r','Yarıçap (m)',1,5,.25,2],['m','Kütle (kg)',.5,5,.5,2],['v','Hız (m/s)',.5,8,.5,4]],eq:'ΣFᵣ = maₘ = mv²/r; aₘ = ω²r',info:'Pembe ok merkeze yönelmiş net kuvveti, turkuaz ok teğetsel hızı gösterir. Hız iki katına çıkarsa aynı yarıçap ve kütlede merkezcil kuvvet dört katına çıkar.',caution:'Merkezcil ivme ve teğetsel ivme farklıdır. Bu deneyde hız büyüklüğü sabit olduğundan teğetsel ivme sıfırdır.'},
{id:'angular',name:'Açısal/çizgisel hız',controls:[['r','Yarıçap (m)',1,5,.25,2],['v','Hız (m/s)',.5,8,.5,4]],eq:'θ = ωt · ω = 2π/T = 2πf · v = ωr · 1 tur = 2π rad = 360°',info:'Aynı dönen katı cismin farklı yarıçaptaki noktalarında açısal hız aynı, çizgisel hız yarıçapla orantılıdır. Aşağıdaki küçük grafik hızın yarıçapla nasıl arttığını gösterir.',caution:'Açısal hız rad/s, çizgisel hız m/s birimindedir. Birimleri birbirine karıştırma.'},
{id:'horizontal',name:'Yatay ipli hareket',controls:[['r','İp uzunluğu (m)',1,5,.25,2],['m','Kütle (kg)',.5,5,.5,2],['v','Hız (m/s)',.5,8,.5,4]],eq:'Fᵢₚ = mv²/r (sürtünmesiz yatay düzlem)',info:'İp merkeze doğru gerilme uygular. İp koparsa yatay düzlemde başka yatay kuvvet yoksa cisim kesildiği noktadaki teğet boyunca sabit hızla gider.',caution:'Bu model üstten görünüşlüdür. İp koptuktan sonra yatay düzlemde yerçekimi düşey yönde yüzeyin normal kuvvetiyle dengelenir.'},
{id:'vertical',name:'Düşey çembersel',controls:[['r','Yarıçap (m)',1,5,.25,2],['m','Kütle (kg)',.5,5,.5,2],['v','Alt noktadaki hız (m/s)',5,18,.5,12]],eq:'Tₐₗₜ − mg = mvₐₗₜ²/r · Tᵤₛₜ + mg = mvᵤₛₜ²/r · vᵤₛₜ² = vₐₗₜ² − 4gr',info:'Enerji korunumuyla düşey çemberde hız yükseldikçe azalır. Gerilme konuma göre değişir. İp gevşerse cisim artık çemberi takip etmez; serbest atışa geçer.',caution:'Tam tur için en üst noktada v² ≥ gr gerekir. Bu koşul sağlanmazsa ideal ip gergin kalamaz; simülasyon serbest atışa geçer.'},
{id:'cut',name:'İpin kesilmesi',controls:[['r','Yarıçap (m)',1,5,.25,2],['v','Başlangıç hızı (m/s)',1,8,.5,4],['gravity','Yerçekimi (m/s²)',0,10,.2,9.8]],eq:'x = x₀ + vₓ₀t · y = y₀ + vᵧ₀t + ½gt² (ekranda y aşağı +)',info:'İp kesilmeden önce teğetsel hız vardır. İp kesilince gerilme ortadan kalkar; cisim o andaki teğetsel hızıyla yoluna devam eder. Yerçekimi açıkken hareket paraboliktir.',caution:'Ekran koordinatlarında aşağı yön pozitif seçilmiştir. Yerçekimi sıfırken yol düz bir doğrudur.'},
{id:'conical',name:'Konik sarkaç',controls:[['L','İp uzunluğu (m)',1,5,.25,3],['angle','Düşeyle açı (°)',10,70,1,35],['m','Kütle (kg)',.5,5,.5,2]],eq:'r = L sinθ · Tcosθ = mg · Tsinθ = mv²/r · ω² = g/(Lcosθ)',info:'Cisim yatay bir çember çizerken ip bir koni yüzeyi tarar. Gerilmenin düşey bileşeni ağırlığı dengeler; yatay bileşeni merkezcil kuvveti sağlar.',caution:'θ sıfıra yaklaşırken yarıçap ve hız sıfıra yaklaşır. Sürtünme ve hava direnci ihmal edilir.'},
{id:'bank',name:'Viraj ve sürtünme',controls:[['r','Viraj yarıçapı (m)',20,200,5,80],['mu','Sürtünme katsayısı',0,.9,.05,.4],['angle','Yol eğimi (°)',0,35,1,10]],eq:'Düz viraj: vₘₐₓ = √(μgr) · Sürtünmesiz eğimli viraj: v₀ = √(rg tanθ)',info:'Düz yolda sürtünme merkezcil kuvveti sağlar. Eğimli virajda normal kuvvetin yatay bileşeni de merkeze yönelir. Hız sınırını değiştiren temel etkenler yarıçap, sürtünme ve eğimdir.',caution:'Eğimli ve sürtünmeli virajın maksimum hızı, sürtünme içe yönelirken v² = rg(sinθ+μcosθ)/(cosθ−μsinθ) bağıntısıyla hesaplanır; payda pozitif olmalıdır.'},
{id:'satellite',name:'Uydu ve yörünge',controls:[['alt','Yükseklik (km)',200,30000,100,400],['mass','Uydu kütlesi (kg)',100,2000,100,500]],eq:'F = GMm/r² · v = √(GM/r) · T = 2π√(r³/GM) · r = Rᴇ + h',info:'İdeal dairesel yörüngede kütle çekimi merkezcil kuvveti sağlar. Uydu kütlesi yörünge hızını değiştirmez. Yükseklik arttıkça hız azalır, periyot artar.',caution:'Dünya küresel, yörünge dairesel, hava direnci ve diğer gök cisimlerinin etkileri ihmal edilmiştir.'}
];
let selected=0,state={},theta=-Math.PI/3,flight=null,playing=true,last=0,kmh=false;
function num(x,d=2){return Number.isFinite(x)?x.toFixed(d):'—'}function setup(){const d=defs[selected];$('heading').textContent=d.name;$('equations').textContent=d.eq;$('explain').textContent=d.info;$('caution').textContent=d.caution;$('inputs').replaceChildren();state={};for(const [key,label,min,max,step,value] of d.controls){state[key]=value;const wrap=document.createElement('label'),txt=document.createElement('span'),out=document.createElement('output'),input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=value;txt.textContent=label+' ';out.textContent=value;wrap.append(txt,out,input);$('inputs').append(wrap);input.oninput=()=>{state[key]=+input.value;out.textContent=input.value;reset(false);metrics()}}$('cut').hidden=!['horizontal','cut','vertical'].includes(d.id);reset(false);metrics();document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)))}function reset(update=true){theta=-Math.PI/3;flight=null;$('status').textContent='Simülasyon hazır.';if(update)metrics()}function calculate(){const s=state,d=defs[selected].id,r=s.r||2,m=s.m||2,v=s.v||4;let o={};if(['uniform','force','angular','horizontal','vertical','cut'].includes(d)){o={'Hız':num(v)+(kmh?' m/s ('+num(v*3.6)+' km/sa)':' m/s'),'Açısal hız':num(v/r)+' rad/s','Merkezcil ivme':num(v*v/r)+' m/s²','Merkezcil kuvvet':num(m*v*v/r)+' N','Periyot':num(2*Math.PI*r/v)+' s','Frekans':num(v/(2*Math.PI*r))+' Hz'}}if(d==='vertical'){const top2=v*v-4*g*r;o['Üst hız']=top2>=0?num(Math.sqrt(top2))+' m/s':'Üste ulaşamaz';o['Alt gerilme']=num(m*(v*v/r+g))+' N';o['Üst gerilme']=top2>=g*r?num(m*(top2/r-g))+' N':'İp gevşer'}if(d==='conical'){const a=s.angle*Math.PI/180,rad=s.L*Math.sin(a),w=Math.sqrt(g/(s.L*Math.cos(a)));o={'Çember yarıçapı':num(rad)+' m','İp gerilmesi':num(s.m*g/Math.cos(a))+' N','Açısal hız':num(w)+' rad/s','Çizgisel hız':num(w*rad)+' m/s','Periyot':num(2*Math.PI/w)+' s'}}if(d==='bank'){const a=s.angle*Math.PI/180,den=Math.cos(a)-s.mu*Math.sin(a);o={'Düz viraj vₘₐₓ':num(Math.sqrt(s.mu*g*s.r)*3.6)+' km/sa','Sürtünmesiz eğim hızı':num(Math.sqrt(s.r*g*Math.tan(a))*3.6)+' km/sa','Eğimli vₘₐₓ':den>0?num(Math.sqrt(s.r*g*(Math.sin(a)+s.mu*Math.cos(a))/den)*3.6)+' km/sa':'Bu modelde sınır yok'}}if(d==='satellite'){const rad=RE+s.alt*1000,vv=Math.sqrt(G*ME/rad),T=2*Math.PI*rad/vv;o={'Yörünge hızı':num(vv/1000,3)+' km/s','Periyot':num(T/60,1)+' dk','Çekim ivmesi':num(G*ME/rad**2,3)+' m/s²','Çekim kuvveti':num(G*ME*s.mass/rad**2)+' N'}}return o}
function metrics(){$('metrics').replaceChildren();for(const [k,v] of Object.entries(calculate())){const div=document.createElement('div');const name=document.createElement('small');name.textContent=k;const value=document.createElement('div');value.textContent=v;div.append(name,value);$('metrics').append(div)}}
function arrow(x,y,dx,dy,color,label){const a=Math.atan2(dy,dx);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy);ctx.stroke();ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx-12*Math.cos(a-.5),y+dy-12*Math.sin(a-.5));ctx.lineTo(x+dx-12*Math.cos(a+.5),y+dy-12*Math.sin(a+.5));ctx.fill();ctx.font='17px system-ui';ctx.fillText(label,x+dx+8,y+dy-8)}
function draw(t){const dt=Math.min(.04,Math.max(0,(t-last)/1000||0));last=t;const d=defs[selected].id,s=state;ctx.clearRect(0,0,W,H);ctx.fillStyle='#c3d4e9';ctx.font='17px system-ui';let cx=380,cy=260,r=(s.r||2)*48,v=s.v||4,m=s.m||2,omega=v/(s.r||2);if(d==='satellite'){r=160+110*(s.alt/30000);omega=2*Math.PI/(8+18*s.alt/30000);ctx.fillStyle='#326eb5';ctx.beginPath();ctx.arc(cx,cy,65,0,7);ctx.fill();ctx.fillStyle='#b6e3ff';ctx.fillText('Dünya',cx-26,cy+6)}if(d==='conical'){r=s.L*Math.sin(s.angle*Math.PI/180)*44;omega=Math.sqrt(g/(s.L*Math.cos(s.angle*Math.PI/180)));cy=300;ctx.fillStyle='#cbd9ee';ctx.fillText('Askı noktası',cx-58,70);ctx.strokeStyle='#93b6cc';ctx.beginPath();ctx.moveTo(cx,85);ctx.lineTo(cx+Math.cos(theta)*r,cy+Math.sin(theta)*r*.3);ctx.stroke()}if(d==='bank'){const a=s.angle*Math.PI/180;ctx.save();ctx.translate(cx,cy+65);ctx.rotate(-a);ctx.strokeStyle='#8296ac';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(-250,0);ctx.lineTo(250,0);ctx.stroke();ctx.fillStyle='#67e0d3';ctx.fillRect(-25,-45,65,37);ctx.restore();arrow(cx,cy+15,0,80,'#f7b77d','mg');arrow(cx,cy+15,75*Math.sin(a),-75*Math.cos(a),'#78c8ff','N');ctx.fillStyle='#d8e7f7';ctx.fillText('Eğim: '+s.angle+'°',30,40);requestAnimationFrame(draw);return}if(d==='angular'){ctx.strokeStyle='#334e6a';ctx.beginPath();ctx.moveTo(60,485);ctx.lineTo(300,485);ctx.lineTo(300,370);ctx.stroke();ctx.strokeStyle='#f1c875';ctx.beginPath();ctx.moveTo(60,485);ctx.lineTo(290,390);ctx.stroke();ctx.fillStyle='#c5d8ee';ctx.fillText('v ∝ r (ω sabit)',80,360)}if(!['conical','bank'].includes(d)){ctx.setLineDash([7,7]);ctx.strokeStyle='#38516b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();ctx.setLineDash([])}if(playing){if(!flight){if(d==='vertical'){const top2=v*v-4*g*(s.r||2);const q=Math.max(0,v*v-2*g*(s.r||2)*(1-Math.sin(theta)));if(q<0 || q/(s.r||2)+g*Math.sin(theta)<=0){release(cx+Math.cos(theta)*r,cy+Math.sin(theta)*r,-Math.sin(theta)*Math.sqrt(q)*48,Math.cos(theta)*Math.sqrt(q)*48);$('status').textContent='Enerji/gerilme koşulu bozuldu: ip gevşedi.'}else theta+=Math.sqrt(q)/(s.r||2)*dt}else theta+=omega*dt}else{flight.x+=flight.vx*dt;flight.y+=flight.vy*dt+.5*flight.g*48*dt*dt;flight.vy+=flight.g*48*dt}}let x=flight?flight.x:cx+Math.cos(theta)*r,y=flight?flight.y:cy+Math.sin(theta)*r*(d==='conical'?.3:1);if(!flight&&['horizontal','cut','vertical'].includes(d)){ctx.strokeStyle='#a7bcd0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke()}ctx.fillStyle='#70e2d5';ctx.beginPath();ctx.arc(x,y,13,0,7);ctx.fill();if(!flight){arrow(x,y,-Math.sin(theta)*Math.min(110,v*12),Math.cos(theta)*Math.min(110,v*12)*(d==='conical'?.3:1),'#f4c779','v');if(d!=='satellite')arrow(x,y,-Math.cos(theta)*65,-Math.sin(theta)*65*(d==='conical'?.3:1),'#f57d9d','Fₘ');else arrow(x,y,-Math.cos(theta)*80,-Math.sin(theta)*80,'#f57d9d','Fçekim')}else{arrow(x,y,flight.vx*.2,flight.vy*.2,'#f4c779','v');if(flight.g)arrow(x,y,0,75,'#f57d9d','mg')}if(d==='vertical'){ctx.fillStyle='#d4e7fa';ctx.fillText('Üst: T + mg = mv²/r',20,38);ctx.fillText('Alt: T − mg = mv²/r',20,66)}if(d==='conical'){ctx.fillStyle='#c9d9ed';ctx.fillText('Tcosθ = mg',25,40);ctx.fillText('Tsinθ = mv²/r',25,68)}if(flight&&(x< -100||x>W+100||y>H+100||y< -100)){$('status').textContent='Cisim ekrandan çıktı. Sıfırla ile tekrar dene.';playing=false;$('toggle').textContent='▶ Oynat'}requestAnimationFrame(draw)}
function release(x,y,vx,vy){flight={x,y,vx,vy,g:defs[selected].id==='horizontal'?0:defs[selected].id==='cut'?state.gravity:g}}$('cut').onclick=()=>{if(flight)return;const d=defs[selected].id;if(!['horizontal','cut','vertical'].includes(d))return;const r=state.r*48,v=state.v;release(380+Math.cos(theta)*r,260+Math.sin(theta)*r,-Math.sin(theta)*v*48,Math.cos(theta)*v*48);$('status').textContent='İp kesildi: hız teğetsel, ip gerilmesi artık sıfır.'};$('reset').onclick=()=>{reset();playing=true;$('toggle').textContent='⏸ Durdur'};$('toggle').onclick=()=>{playing=!playing;$('toggle').textContent=playing?'⏸ Durdur':'▶ Oynat'};$('unit').onclick=()=>{kmh=!kmh;$('unit').textContent=kmh?'km/sa → m/s':'m/s → km/sa';metrics()};defs.forEach((d,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+d.name;b.onclick=()=>{selected=i;playing=true;$('toggle').textContent='⏸ Durdur';setup()};$('tabs').append(b)});setup();requestAnimationFrame(draw);
</script></body></html>
