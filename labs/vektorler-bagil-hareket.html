<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYT Vektörler ve Bağıl Hareket</title><style>:root{font-family:system-ui;color:#edf4ff;background:#090d16}*{box-sizing:border-box}body{margin:auto;max-width:1150px;padding:16px}h1{font-size:clamp(23px,4vw,34px)}p{color:#bbccdf;line-height:1.5}nav,.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{cursor:pointer;background:#1b304a;color:white;border:1px solid #456080;padding:10px 12px;border-radius:9px}button[aria-pressed=true]{background:#036d8b;border-color:#4fe0f0}section{border:1px solid #30455d;border-radius:15px;padding:14px;background:#111e30;margin:12px 0}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,1fr);gap:12px}@media(max-width:740px){.layout{grid-template-columns:1fr}}canvas{width:100%;height:auto;background:#070e1b;border-radius:10px;touch-action:none;display:block;min-height:220px}.control{display:block;padding:12px 0;border-bottom:1px solid #293a50}.control input{width:100%;accent-color:#36c8ee}strong{color:#7ee9ce}.note{background:#0a2931;padding:12px;border-radius:10px}a{color:#7ee9ce}</style></head><body><a href="../index.html">← Fen Laboratuvarı</a><h1>🧭 Vektörler ve Bağıl Hareket</h1><p>Okları parmağınla sürükle, değerleri değiştir ve sonucu anında gör. YKS için vektör toplama, gözlemciye göre hız ve akıntı.</p><nav id="tabs"></nav><div class="layout"><section><h2 id="heading"></h2><canvas id="scene" width="700" height="520" aria-label="Etkileşimli vektör çizimi"></canvas><div class="tools" id="buttons"></div><p class="note" id="hint"></p></section><section><h2>Kontroller</h2><div id="controls"></div><h3>Hesaplanan sonuç</h3><p id="results" aria-live="polite"></p><h3>Fizik notu</h3><p id="lesson"></p></section></div><script>
'use strict';const $=id=>document.getElementById(id),c=$('scene'),ctx=c.getContext('2d'),pi=Math.PI;let tab=0,drag=null,playing=false,last=0,clock=0;
const vectors=[{name:'K',x:3,y:4,color:'#38bdf8',coef:1,ox:0,oy:0},{name:'L',x:3,y:0,color:'#f6b750',coef:1,ox:0,oy:0},{name:'M',x:0,y:-3,color:'#c7a2ff',coef:1,ox:0,oy:0}];
let cars={K:{x:-2,y:1,vx:3,vy:0},L:{x:-2,y:-2,vx:0,vy:4}},observer='K',follow=false;

function button(label,fn,pressed=false){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',pressed);b.onclick=fn;return b}
function slider(label,min,max,step,value,fn){const box=document.createElement('label');box.className='control';const txt=document.createElement('div');const valueEl=document.createElement('strong');const inp=document.createElement('input');Object.assign(inp,{type:'range',min,max,step,value});inp.oninput=()=>{valueEl.textContent=inp.value;fn(+inp.value);draw()};valueEl.textContent=value;txt.textContent=label+' ';txt.append(valueEl);box.append(txt,inp);$('controls').append(box)}
function setup(){clock=0;playing=false;drag=null;const names=['10×10 Vektörler','Araçlarda bağıl hız','Nehir ve akıntı'];$('tabs').replaceChildren(...names.map((n,i)=>button(n,()=>{tab=i;setup()},i===tab)));$('heading').textContent=names[tab];$('controls').replaceChildren();$('buttons').replaceChildren();if(tab===0){$('hint').textContent='K, L, M oklarının uçlarını tutup büyüklük/yön ayarla. Okun gövdesinden tutup tamamını taşı. İstersen ızgaraya yapışmayı kapat.';vectors.forEach(v=>{slider(v.name+' katsayısı',-2,2,.5,v.coef,n=>v.coef=n)});$('buttons').append(button('Uç uca / Paralelkenar',()=>{parallelogram=!parallelogram;draw()}),button('Izgaraya yapışma: aç/kapat',()=>{snap=!snap;draw()}),button('Okları merkeze getir',()=>{vectors.forEach(v=>{v.ox=0;v.oy=0});draw()}),button('Örnekleri sıfırla',()=>{vectors.forEach(v=>{v.ox=0;v.oy=0});vectors[0].x=3;vectors[0].y=4;vectors[1].x=3;vectors[1].y=0;vectors[2].x=0;vectors[2].y=-3;vectors.forEach(v=>v.coef=1);setup()}))}else if(tab===1){$('hint').textContent='K veya L hız okunun ucunu sürükle. Gözlemci değişince çıkarma sırası değişir.';['K','L'].forEach(k=>['vx','vy'].forEach(axis=>slider(k+' '+axis+' (m/s)',-8,8,1,cars[k][axis],n=>cars[k][axis]=n)));$('buttons').append(...['Yer','K','L'].map(k=>button('Gözlemci: '+k,()=>{observer=k;draw()},observer===k)),button('Kamerayı gözlemciye sabitle',()=>{follow=!follow;draw()}),button('▶ / ⏸',()=>{playing=!playing;last=0}),button('Konumu sıfırla',()=>{cars.K.x=-2;cars.K.y=1;cars.L.x=-2;cars.L.y=-2;clock=0;draw()}))}else{$('hint').textContent='Mavi ok kayığın verilen hızıdır. Akıntı ekle modunda sarı akıntı oku ile yeşil yere göre hız birleşir.';slider('Yön açısı (°)',15,165,1,river.angle,n=>river.angle=n);slider('Verilen hız (m/s)',2,20,1,river.v,n=>river.v=n);slider('Akıntı hızı (m/s)',-10,10,1,river.current,n=>river.current=n);slider('Nehir genişliği (m)',40,160,10,river.width,n=>river.width=n);$('buttons').append(...[['add','Akıntı ekle'],['none','Durgun su'],['ground','Hız zaten yere göre']].map(([k,v])=>button(v,()=>{river.mode=k;clock=0;draw()},river.mode===k)),button('YKS 37°/53° yaklaşımı',()=>{approx=!approx;draw()}),button('▶ / ⏸',()=>{playing=!playing;last=0}),button('↺',()=>{clock=0;playing=false;draw()}))}draw()}
let parallelogram=false,snap=true;function arrow(x,y,dx,dy,color,label='',dash=false){if(Math.hypot(dx,dy)<2)return;ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;if(dash)ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy);ctx.stroke();ctx.setLineDash([]);const a=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx-12*Math.cos(a-.5),y+dy-12*Math.sin(a-.5));ctx.lineTo(x+dx-12*Math.cos(a+.5),y+dy-12*Math.sin(a+.5));ctx.fill();ctx.font='16px system-ui';ctx.fillText(label,x+dx+6,y+dy-8);ctx.restore()}
function grid(cx,cy,step){ctx.strokeStyle='#23344b';ctx.lineWidth=1;for(let i=-12;i<=12;i++){ctx.beginPath();ctx.moveTo(cx+i*step,0);ctx.lineTo(cx+i*step,520);ctx.moveTo(0,cy+i*step);ctx.lineTo(700,cy+i*step);ctx.stroke()}ctx.strokeStyle='#60758d';ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(700,cy);ctx.moveTo(cx,0);ctx.lineTo(cx,520);ctx.stroke()}
function fmt(n){return (Math.round(n*100)/100).toString()}
function draw(){ctx.clearRect(0,0,700,520);ctx.fillStyle='#07101d';ctx.fillRect(0,0,700,520);if(tab===0){const cx=350,cy=260,step=38;grid(cx,cy,step);let rx=0,ry=0,chainX=0,chainY=0;vectors.forEach((v,i)=>{const dx=v.x*v.coef,dy=v.y*v.coef;arrow(cx+v.ox*step,cy-v.oy*step,dx*step,-dy*step,v.color,v.name);ctx.beginPath();ctx.arc(cx+v.ox*step,cy-v.oy*step,6,0,2*pi);ctx.fillStyle=v.color;ctx.fill();if(!parallelogram){arrow(cx+chainX*step,cy-chainY*step,dx*step,-dy*step,v.color,v.name+'′',true)}chainX+=dx;chainY+=dy;rx+=dx;ry+=dy});if(parallelogram){const a=vectors[0],b=vectors[1];arrow(cx+a.x*a.coef*step,cy-a.y*a.coef*step,b.x*b.coef*step,-b.y*b.coef*step,'#f6b750','L′',true);arrow(cx+b.x*b.coef*step,cy-b.y*b.coef*step,a.x*a.coef*step,-a.y*a.coef*step,'#38bdf8','K′',true)}arrow(cx,cy,rx*step,-ry*step,'#35e2a6','R');$('results').textContent='R = ('+fmt(rx)+', '+fmt(ry)+') br; |R| = '+fmt(Math.hypot(rx,ry))+' br; açı = '+fmt(Math.atan2(ry,rx)*180/pi)+'°.  x = |R|cosθ, y = |R|sinθ.';$('lesson').textContent='Vektörler yön ve büyüklüğe sahiptir. Bileşke için x bileşenleri kendi arasında, y bileşenleri kendi arasında toplanır. Paralelkenar yöntemi K+L içindir; M ayrıca eklenir.';}else if(tab===1){const ref=observer==='Yer'?{vx:0,vy:0,x:0,y:0}:cars[observer],cx=350-(follow?ref.x*35:0),cy=260+(follow?ref.y*35:0);grid(cx,cy,35);for(const k of ['K','L']){const v=cars[k],x=cx+v.x*35,y=cy-v.y*35;ctx.fillStyle=k==='K'?'#38bdf8':'#f6b750';ctx.beginPath();ctx.arc(x,y,13,0,2*pi);ctx.fill();ctx.fillStyle='#081323';ctx.font='bold 15px system-ui';ctx.fillText(k,x-5,y+5);arrow(x,y,v.vx*22,-v.vy*22,k==='K'?'#38bdf8':'#f6b750','v'+k)}if(observer!=='Yer'){const other=observer==='K'?'L':'K',v=cars[other],dx=v.vx-ref.vx,dy=v.vy-ref.vy;arrow(350,440,dx*20,-dy*20,'#f87171','v'+other+'/'+observer);$('results').textContent='v('+other+'/'+observer+') = ('+fmt(dx)+', '+fmt(dy)+') m/s; büyüklük '+fmt(Math.hypot(dx,dy))+' m/s'}else $('results').textContent='Yere göre K: '+fmt(Math.hypot(cars.K.vx,cars.K.vy))+' m/s; L: '+fmt(Math.hypot(cars.L.vx,cars.L.vy))+' m/s';$('lesson').textContent='Gözlenenin hızı − gözlemcinin hızı. Kamera sabitleme yalnızca görüntüyü değiştirir; fiziksel hızları değiştirmez.';}else{const a=river.angle,rad=a*pi/180,sn=approx&&[37,53,127,143].includes(a)?([37,143].includes(a)?.6:.8):Math.sin(rad),cs=approx&&[37,53,127,143].includes(a)?([37,53].includes(a)?([37].includes(a)?.8:.6):([127].includes(a)?-.6:-.8)):Math.cos(rad),vx=river.v*cs,vy=river.v*sn,va=river.mode==='add'?river.current:0,groundX=vx+va,t=river.width/vy,exit=groundX*t,drift=va*t;const top=90,bot=450,scale=(bot-top)/river.width,start=350;ctx.fillStyle='#0a3551';ctx.fillRect(0,top,700,bot-top);ctx.strokeStyle='#80b4ce';ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(700,top);ctx.moveTo(0,bot);ctx.lineTo(700,bot);ctx.stroke();const scaleX=Math.min(scale,280/Math.max(1,Math.abs(exit),Math.abs(vx*t))),bx=start+groundX*Math.min(clock,t)*scaleX,by=bot-vy*Math.min(clock,t)*scale;ctx.setLineDash([6,5]);ctx.strokeStyle='#4ee0b5';ctx.beginPath();ctx.moveTo(start,bot);ctx.lineTo(start+exit*scaleX,top);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='white';ctx.beginPath();ctx.arc(bx,by,12,0,2*pi);ctx.fill();arrow(bx,by,vx*7,-vy*7,'#38bdf8',river.mode==='ground'?'v_yer':'v_su');if(river.mode==='add'){arrow(bx+vx*7,by-vy*7,va*7,0,'#f6b750','v_akıntı');arrow(bx,by,groundX*7,-vy*7,'#35e2a6','v_yer')}$('results').textContent='Geçiş süresi: '+fmt(t)+' s. Yere göre yatay hız: '+fmt(groundX)+' m/s. O noktasına göre çıkış: '+fmt(exit)+' m. '+(river.mode==='add'?'Akıntının sürüklemesi: '+fmt(drift)+' m.':'Akıntı sürüklenmesi bu modda hesaplanmaz.');$('lesson').textContent=river.mode==='ground'?'Verilen vektör zaten yere göre hızdır. Akıntı ikinci kez eklenmez.':river.mode==='none'?'Durgun su: akıntı sıfırdır.':'Tam karşıya çıkmak için yere göre yatay hız sıfır olmalı: v·cosθ + v_akıntı = 0. '+(Math.abs(river.current)<=river.v?'Bu hızlarla mümkün.':'Akıntı kayıktan hızlı: tam karşıya çıkmak mümkün değil function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*700/r.width,y:(e.clientY-r.top)*520/r.height}}c.onpointerdown=e=>{const p=pos(e);if(tab===0){let best=1e9;drag=null;for(let i=0;i<3;i++){const v=vectors[i],sx=350+v.ox*38,sy=260-v.oy*38,ex=sx+v.x*v.coef*38,ey=sy-v.y*v.coef*38;const tip=Math.hypot(p.x-ex,p.y-ey),len=Math.hypot(ex-sx,ey-sy),u=len?Math.max(0,Math.min(1,((p.x-sx)*(ex-sx)+(p.y-sy)*(ey-sy))/(len*len))):0,body=Math.hypot(p.x-(sx+u*(ex-sx)),p.y-(sy+u*(ey-sy)));if(tip<best&&tip<40){best=tip;drag={type:'vector',i,mode:'tip'}}if(body<18&&tip>25&&body<best){best=body;drag={type:'vector',i,mode:'body',offsetX:p.x-sx,offsetY:p.y-sy}}}}}else if(tab===1){let best=1e9;for(const k of ['K','L']){const v=cars[k],ref=observer==='Yer'?{x:0,y:0}:cars[observer],cx=350-(follow?ref.x*35:0),cy=260+(follow?ref.y*35:0),d=Math.hypot(p.x-(cx+v.x*35+v.vx*22),p.y-(cy-v.y*35-v.vy*22));if(d<best){best=d;drag={type:'car',k}}}if(best>55)drag=null}else drag={type:'river'};if(drag)c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag)return;const p=pos(e);if(drag.type==='vector'){const v=vectors[drag.i];if(drag.mode==='body'){const ox=(p.x-drag.offsetX-350)/38,oy=(260-p.y+drag.offsetY)/38;v.ox=Math.max(-7,Math.min(7,snap?Math.round(ox):Math.round(ox*10)/10));v.oy=Math.max(-6,Math.min(6,snap?Math.round(oy):Math.round(oy*10)/10))}else{if(v.coef===0)v.coef=1;const vx=(p.x-350-v.ox*38)/38/v.coef,vy=(260-p.y-v.oy*38)/38/v.coef;v.x=Math.max(-8,Math.min(8,snap?Math.round(vx):Math.round(vx*10)/10));v.y=Math.max(-8,Math.min(8,snap?Math.round(vy):Math.round(vy*10)/10))}}else if(drag.type==='car'){const v=cars[drag.k],ref=observer==='Yer'?{x:0,y:0}:cars[observer],cx=350-(follow?ref.x*35:0),cy=260+(follow?ref.y*35:0);v.vx=Math.max(-8,Math.min(8,Math.round((p.x-cx-v.x*35)/22)));v.vy=Math.max(-8,Math.min(8,Math.round((cy-v.y*35-p.y)/22)))}else{const deg=Math.atan2(450-p.y,p.x-350)*180/pi;river.angle=Math.max(15,Math.min(165,Math.round(deg)));clock=0}draw()};c.onpointerup=()=>{drag=null;refreshControls();draw()};c.onpointercancel=()=>{drag=null};function refreshControls(){const inputs=$('controls').querySelectorAll('input');if(tab===0){vectors.forEach((v,i)=>{if(inputs[i])inputs[i].value=v.coef})}else if(tab===1){const vals=[cars.K.vx,cars.K.vy,cars.L.vx,cars.L.vy];inputs.forEach((el,i)=>{el.value=vals[i]})}else if(inputs[0])inputs[0].value=river.angle;inputs.forEach(el=>{const valueEl=el.parentElement.querySelector('strong');if(valueEl)valueEl.textContent=el.value})}function frame(now){if(playing){const dt=Math.min(.05,last?(now-last)/1000:0);if(tab===1){for(const k of ['K','L']){cars[k].x+=cars[k].vx*dt*.6;cars[k].y+=cars[k].vy*dt*.6}}else if(tab===2){const rad=river.angle*pi/180,vy=river.v*Math.sin(rad);clock=Math.min(river.width/vy,clock+dt*3);if(clock>=river.width/vy)playing=false}draw()}last=now;requestAnimationFrame(frame)}setup();requestAnimationFrame(frame);
</script></body></html>
