name: Curriculum Evidence Gates
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths: ['curriculum/**', 'AGENTS.md', 'tests/curriculum.test.js', '.github/workflows/curriculum-ci.yml']
  push:
    branches: [main]
    paths: ['curriculum/**', 'AGENTS.md', 'tests/curriculum.test.js', '.github/workflows/curriculum-ci.yml']
permissions:
  contents: read
jobs:
  coverage-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/curriculum.test.js
      - name: Verify tables match the ledger
        run: |
          node curriculum/render.cjs
          git diff --exit-code -- curriculum
