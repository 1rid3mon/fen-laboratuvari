name: TYT Cografya Harita Laboratuvari
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'labs/cografya-*'
      - '.github/workflows/tyt-cografya-ci.yml'
  pull_request:
    paths:
      - 'labs/cografya-*'
      - '.github/workflows/tyt-cografya-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check labs/cografya-veri.js
          node --check labs/cografya-harita.js
          node --check labs/cografya.test.cjs
      - name: Geography and UI regression
        run: node --test labs/cografya.test.cjs
