name: Ebru Surface Learning Cycle
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths: ['labs/ebru-*', 'tests/ebru-browser.cjs', '.github/workflows/ebru-ci.yml']
  push:
    branches: [main]
    paths: ['labs/ebru-*', 'tests/ebru-browser.cjs', '.github/workflows/ebru-ci.yml']
permissions:
  contents: read
jobs:
  models-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test labs/*.test.cjs tests/*.test.js
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Verify preinstalled browser
        run: |
          node -e "if(!require('node:fs').existsSync(require('playwright')[process.argv[1]].executablePath()))process.exit(1)" ${{ matrix.engine }}
      - run: node tests/ebru-browser.cjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebru-${{ matrix.engine }}
          path: test-results/
