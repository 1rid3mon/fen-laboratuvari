name: TYT 2018 MEB Electric Circuits and Interaction
on:
  push:
    paths:
      - 'labs/tyt-devre*'
      - 'index.html'
      - '.github/workflows/tyt-devre-ci.yml'
  pull_request:
    paths:
      - 'labs/tyt-devre*'
      - 'index.html'
      - '.github/workflows/tyt-devre-ci.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check labs/tyt-devre-math.js
          node --check labs/tyt-devre-ui.js
          node --check labs/tyt-devre.test.cjs
      - name: Physics and iPad drag regression
        run: node --test labs/tyt-devre.test.cjs
