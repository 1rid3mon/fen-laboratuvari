name: Geometric Volume Learning Cycle
on:
  pull_request:
    paths: ['labs/hacim-*', 'labs/tyt-madde-tamamlayici.html', 'labs/ozkutle-olcum.css', 'tests/hacim-browser.cjs', '.github/workflows/hacim-ci.yml']
  push:
    branches: [main]
    paths: ['labs/hacim-*', 'labs/tyt-madde-tamamlayici.html', 'labs/ozkutle-olcum.css', 'tests/hacim-browser.cjs', '.github/workflows/hacim-ci.yml']
permissions:
  contents: read
jobs:
  models-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test labs/*.test.cjs tests/*.test.js
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node tests/hacim-browser.cjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volume-${{ matrix.engine }}
          path: test-results/
