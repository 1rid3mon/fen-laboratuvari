name: All Labs Visual Interaction Audit
on:
  push:
    paths:
      - 'labs/**'
      - 'index.html'
      - '.github/workflows/tum-lab-etkilesim-ci.yml'
  pull_request:
    paths:
      - 'labs/**'
      - 'index.html'
      - '.github/workflows/tum-lab-etkilesim-ci.yml'
jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and interactivity inventory
        run: |
          node --check labs/tum-laboratuvar-etkilesim.test.cjs
          node --test labs/tum-laboratuvar-etkilesim.test.cjs

      - name: Safari deferred-load boot regression and nine bio experiments
        run: |
          node --check labs/enerji-core.js
          node --check labs/enerji-safari-defer.test.cjs
          node --test labs/enerji-safari-defer.test.cjs labs/enerji-dom.test.cjs labs/enerji-smoke.test.cjs

      - name: Nine living biology scenes and Safari touch regression
        run: |
          node --check labs/enerji-visual.js
          node --check labs/enerji-core.js
          node --check labs/enerji-visual.test.cjs
          node --test labs/enerji-visual.test.cjs labs/enerji-safari-defer.test.cjs labs/enerji-dom.test.cjs labs/enerji-smoke.test.cjs
