name: All Labs Visual Interaction Audit
on:
  push:
    paths:
      - 'labs/**'
      - 'index.html'
      - '.github/workflows/tum-lab-etkilesim-ci.yml'
  pull_request:
    paths:
      - 'labs/**'
      - 'index.html'
      - '.github/workflows/tum-lab-etkilesim-ci.yml'
jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and interactivity inventory
        run: |
          node --check labs/tum-laboratuvar-etkilesim.test.cjs
          node --check labs/tyt-basinc-dalgalar-v2.js
          node --check labs/tyt-basinc-v3-model.js
          node --check labs/tyt-basinc-v3.js
          node --check labs/tyt-basinc-v3.test.cjs
          node --check labs/tyt-basinc-v3-ui.test.cjs
          test -f labs/tyt-basinc-dalgalar-v2.html
          node --test labs/tum-laboratuvar-etkilesim.test.cjs
      - name: 2018 MEB TYT matter and entry regression
        run: |
          node --test labs/tyt-madde-ozellikleri.test.cjs labs/tyt-madde-tamamlayici.test.cjs labs/tyt-fizige-giris.test.cjs labs/tyt-hareket-temelleri.test.cjs

      - name: Pressure V3 2018 MEB geometry and interaction regression
        run: |
          node --test labs/tyt-basinc-v3.test.cjs labs/tyt-basinc-v3-ui.test.cjs

      - name: Four touch-first TYT topic physics and gesture regression
        run: |
          node --check labs/tyt-dort-atolye-model.js
          node --check labs/tyt-dort-atolye.js
          node --check labs/tyt-dort-atolye-model.test.cjs
          node --check labs/tyt-dort-atolye-ui.test.cjs
          test -f labs/tyt-dort-atolye.html
          node --test labs/tyt-dort-atolye-model.test.cjs labs/tyt-dort-atolye-ui.test.cjs

      - name: Dedicated TYT 9.3 and 9.4 mechanics and energy
        run: |
          node --check labs/tyt-mekanik-2018-model.js
          node --check labs/tyt-mekanik-2018.js
          node --check labs/tyt-mekanik-2018-model.test.cjs
          node --check labs/tyt-mekanik-2018-ui.test.cjs
          test -f labs/tyt-mekanik-2018.html
          node --test labs/tyt-mekanik-2018-model.test.cjs labs/tyt-mekanik-2018-ui.test.cjs

      - name: Flow and wave MEB qualitative physics and touch regression
        run: |
          node --check labs/tyt-akiskan-dalga-model.js
          node --check labs/tyt-akiskan-dalga.js
          node --check labs/tyt-akiskan-dalga-model.test.cjs
          node --check labs/tyt-akiskan-dalga-ui.test.cjs
          node --test labs/tyt-akiskan-dalga-model.test.cjs labs/tyt-akiskan-dalga-ui.test.cjs
      - name: Existing TYT physical laboratories cross-regression
        run: |
          node --test labs/tyt-devre.test.cjs labs/tyt-elektro.test.cjs labs/isi-sicaklik.test.cjs labs/tyt-basinc-dalgalar.test.cjs

      - name: TYT 10.4.8 prism optics physics and pointer regression
        run: |
          node --check labs/tyt-optik-prizma-model.js
          node --check labs/tyt-optik-prizma.js
          node --check labs/tyt-optik-prizma-model.test.cjs
          node --check labs/tyt-optik-prizma-ui.test.cjs
          node --test labs/tyt-optik-prizma-model.test.cjs labs/tyt-optik-prizma-ui.test.cjs

      - name: Ten-unit TYT MEB coverage and AYT separation gate
        run: |
          node --check labs/tyt-kapsam-2018.test.cjs
          node --test labs/tyt-kapsam-2018.test.cjs
      - name: Safari deferred-load boot regression and nine bio experiments
        run: |
          node --check labs/enerji-core.js
          node --check labs/enerji-safari-defer.test.cjs
          node --test labs/enerji-safari-defer.test.cjs labs/enerji-dom.test.cjs labs/enerji-smoke.test.cjs

      - name: Nine living biology scenes and Safari touch regression
        run: |
          node --check labs/enerji-visual.js
          node --check labs/enerji-core.js
          node --check labs/enerji-visual.test.cjs
          node --check labs/enerji-touch.test.cjs
          node --test labs/enerji-visual.test.cjs labs/enerji-touch.test.cjs labs/enerji-safari-defer.test.cjs labs/enerji-dom.test.cjs labs/enerji-smoke.test.cjs
