name: Qualitative Mixture Learning Cycle
on:
  pull_request:
    paths: ['labs/karisim-*', 'labs/tyt-madde-tamamlayici.html', 'tests/karisim-browser.cjs', '.github/workflows/karisim-ci.yml']
  push:
    branches: [main]
    paths: ['labs/karisim-*', 'labs/tyt-madde-tamamlayici.html', 'tests/karisim-browser.cjs', '.github/workflows/karisim-ci.yml']
permissions:
  contents: read
jobs:
  models-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test labs/*.test.cjs tests/*.test.js
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Verify preinstalled browser matches package
        run: |
          node -e "const fs=require('node:fs'); const p=require('playwright')[process.argv[1]].executablePath(); if(!fs.existsSync(p)) throw Error('Browser missing: '+p)" ${{ matrix.engine }}
      - run: node tests/karisim-browser.cjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixture-${{ matrix.engine }}
          path: test-results/
