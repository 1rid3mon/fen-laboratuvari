name: AYT Fizik 2018 MEB Hareket Enerji Momentum Tork Denge
on:
  push:
    paths:
      - 'labs/hareket-*'
      - 'labs/bagil-lab.js'
      - 'labs/newton-lab.js'
      - 'labs/ivmeli-*'
      - 'labs/atis-*'
      - 'labs/fizik-enerji*'
      - 'labs/momentum*'
      - 'labs/mekanik-*'
      - 'labs/tork-denge*'
      - 'labs/basit-makineler*'
      - 'labs/elektrik-alan*'
      - 'labs/is-guc-enerji.html'
      - 'labs/itme-cizgisel-momentum.html'
      - 'labs/iki-boyutta-hareket.html'
      - 'labs/bir-boyutta-sabit-ivmeli-hareket.html'
      - 'labs/vektorler-bagil-hareket.html'
      - 'labs/newton-hareket-yasalari.html'
      - '.github/workflows/ayt-fizik-hareket-ci.yml'
  pull_request:
    paths:
      - 'labs/hareket-*'
      - 'labs/bagil-lab.js'
      - 'labs/newton-lab.js'
      - 'labs/ivmeli-*'
      - 'labs/atis-*'
      - 'labs/fizik-enerji*'
      - 'labs/momentum*'
      - 'labs/mekanik-*'
      - 'labs/tork-denge*'
      - 'labs/basit-makineler*'
      - 'labs/elektrik-alan*'
      - 'labs/is-guc-enerji.html'
      - 'labs/itme-cizgisel-momentum.html'
      - 'labs/iki-boyutta-hareket.html'
      - 'labs/bir-boyutta-sabit-ivmeli-hareket.html'
      - 'labs/vektorler-bagil-hareket.html'
      - 'labs/newton-hareket-yasalari.html'
      - '.github/workflows/ayt-fizik-hareket-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check labs/hareket-math.js
          node --check labs/bagil-lab.js
          node --check labs/newton-lab.js
          node --check labs/ivmeli-math.js
          node --check labs/ivmeli-lab.js
          node --check labs/ivmeli.test.cjs
          node --check labs/atis-math.js
          node --check labs/atis-lab.js
          node --check labs/atis.test.cjs
          node --check labs/fizik-enerji-math.js
          node --check labs/fizik-enerji-lab.js
          node --check labs/momentum-math.js
          node --check labs/momentum-lab.js
          node --check labs/mekanik-ui.js
          node --check labs/fizik-enerji.test.cjs
          node --check labs/momentum.test.cjs
          node --check labs/mekanik-dom.test.cjs
          node --check labs/tork-denge-math.js
          node --check labs/tork-denge-lab.js
          node --check labs/tork-denge-pointer.js
          node --check labs/tork-denge.test.cjs
          node --check labs/basit-makineler-math.js
          node --check labs/basit-makineler-lab.js
          node --check labs/basit-makineler.test.cjs
          node --check labs/elektrik-alan-math.js
          node --check labs/elektrik-alan-lab.js
          node --check labs/elektrik-alan.test.cjs
          node --check labs/hareket.test.cjs
      - name: Physics and DOM regression tests
        run: node --test labs/hareket.test.cjs labs/ivmeli.test.cjs labs/atis.test.cjs labs/fizik-enerji.test.cjs labs/momentum.test.cjs labs/mekanik-dom.test.cjs labs/tork-denge.test.cjs labs/basit-makineler.test.cjs
